[project]
name = "vectorless-rag"
version = "2.0.0"
description = "Vectorless RAG — company-scoped document intelligence API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2.0",

    # LLM
    "langchain>=1.3.0",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.0",

    # PDF extraction
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",

    # Utilities
    "python-dotenv>=1.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "notebook>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]